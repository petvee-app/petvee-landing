<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetVee Web App — Chăm sóc sức khoẻ thú cưng</title>
  <meta name="description" content="Dùng PetVee ngay trên trình duyệt. Quét bệnh AI, hỏi bác sĩ AI 24/7, theo dõi sức khoẻ thú cưng.">
  <meta property="og:title" content="PetVee Web App">
  <meta property="og:description" content="Dùng PetVee ngay trên trình duyệt — không cần tải app.">
  <meta property="og:url" content="https://petvee.app/web">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #FFFAF3;
      font-family: 'Be Vietnam Pro', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #5C4033;
    }
    .redirect-msg {
      padding: 24px;
      max-width: 420px;
    }
    .redirect-msg h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2D1B0E;
      margin-bottom: 12px;
    }
    .redirect-msg p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .redirect-msg a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #FF8C42, #FF6B35);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(255,107,53,0.25);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .redirect-msg a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255,107,53,0.35);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #FFE8D6;
      border-top-color: #FF6B35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>window.location.replace("https://petvee.lovable.app");</script>
</head>
<body>
  <noscript>
    <div class="redirect-msg">
      <h1>PetVee Web App</h1>
      <p>Bạn đang được chuyển đến PetVee Web App...</p>
      <a href="https://petvee.lovable.app">Mở PetVee Web App →</a>
    </div>
  </noscript>
  <div class="redirect-msg">
    <div class="spinner"></div>
    <h1>Đang mở PetVee Web App...</h1>
    <p>Nếu không tự chuyển, nhấn nút bên dưới.</p>
    <a href="https://petvee.lovable.app">Mở PetVee Web App →</a>
  </div>
</body>
</html>
